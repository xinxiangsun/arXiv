name: arXiv-daily-ai-enhanced
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync
      - name: Verify DeepSeek structured paper summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          LANGUAGE: ${{ vars.LANGUAGE }}
        run: |
          source .venv/bin/activate
          cd ai
          python - <<'PY'
          import os
          from enhance import process_all_items
          sample = {
              "id": "verification",
              "summary": "We study X-ray absorption in high-redshift gamma-ray bursts. We jointly fit time-resolved spectra with an absorbed power-law model, comparing constant and variable intrinsic column density. Simulated spectra show that redshift and photon statistics limit the significance of apparent absorption evolution. We conclude that claims of evolution require calibration against a constant-column null model."
          }
          results = process_all_items([sample], os.environ["MODEL_NAME"], os.environ.get("LANGUAGE") or "Chinese", 1)
          assert len(results) == 1 and results[0] is not None
          fields = results[0]["AI"]
          assert set(fields) == {"tldr", "motivation", "method", "result", "conclusion"}
          assert all(isinstance(v, str) and v.strip() for v in fields.values())
          assert fields["tldr"] != "Summary generation failed"
          print("Live structured-output verification passed: all five summary fields generated.")
          PY
